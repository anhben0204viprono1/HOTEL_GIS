<!-- templates/search.html -->
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tìm kiếm khách sạn - Hotel GIS</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/main.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <nav class="navbar">
          <div class="logo">
            <i class="fas fa-hotel"></i>
            <span>Hotel GIS</span>
          </div>
          <ul class="nav-menu">
            <li><a href="/">Trang chủ</a></li>
            <li><a href="/search" class="active">Tìm kiếm</a></li>
            <li><a href="/my-bookings">Đơn đặt phòng</a></li>
            <li><a href="#" class="btn-login">Đăng nhập</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="search-page">
      <!-- Sidebar Filters -->
      <aside class="filters-sidebar">
        <div class="filter-header">
          <h3>Bộ lọc</h3>
          <button class="btn-clear-filters">Xóa tất cả</button>
        </div>

        <!-- Price Filter -->
        <div class="filter-section">
          <h4>Giá mỗi đêm</h4>
          <div class="price-inputs">
            <input
              type="number"
              id="minPrice"
              placeholder="Tối thiểu"
              min="0"
            />
            <span>-</span>
            <input type="number" id="maxPrice" placeholder="Tối đa" min="0" />
          </div>
          <div class="price-range">
            <input
              type="range"
              id="priceRange"
              min="0"
              max="10000000"
              step="100000"
              value="5000000"
            />
            <div class="range-labels">
              <span>0đ</span>
              <span>10,000,000đ</span>
            </div>
          </div>
        </div>

        <!-- Rating Filter -->
        <div class="filter-section">
          <h4>Đánh giá</h4>
          <div class="rating-filters">
            <label class="checkbox-label">
              <input type="checkbox" value="5" class="rating-filter" />
              <span><i class="fas fa-star"></i> 5 sao</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" value="4" class="rating-filter" />
              <span><i class="fas fa-star"></i> 4+ sao</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" value="3" class="rating-filter" />
              <span><i class="fas fa-star"></i> 3+ sao</span>
            </label>
          </div>
        </div>

        <!-- Distance Filter -->
        <div class="filter-section">
          <h4>Khoảng cách</h4>
          <div class="distance-filter">
            <input
              type="range"
              id="distanceRange"
              min="1"
              max="50"
              value="10"
            />
            <span id="distanceValue">Trong vòng 10 km</span>
          </div>
          <button class="btn btn-secondary btn-use-location">
            <i class="fas fa-location-arrow"></i> Dùng vị trí của tôi
          </button>
        </div>

        <!-- Amenities Filter -->
        <div class="filter-section">
          <h4>Tiện nghi</h4>
          <div class="amenities-filters">
            <label class="checkbox-label">
              <input type="checkbox" value="wifi" class="amenity-filter" />
              <span><i class="fas fa-wifi"></i> WiFi miễn phí</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" value="pool" class="amenity-filter" />
              <span><i class="fas fa-swimming-pool"></i> Hồ bơi</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" value="parking" class="amenity-filter" />
              <span><i class="fas fa-parking"></i> Bãi đỗ xe</span>
            </label>
            <label class="checkbox-label">
              <input
                type="checkbox"
                value="restaurant"
                class="amenity-filter"
              />
              <span><i class="fas fa-utensils"></i> Nhà hàng</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" value="gym" class="amenity-filter" />
              <span><i class="fas fa-dumbbell"></i> Phòng gym</span>
            </label>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="search-main">
        <!-- Search Bar -->
        <div class="search-bar-sticky">
          <div class="search-inputs">
            <input
              type="text"
              id="searchLocation"
              placeholder="Tìm theo địa điểm..."
            />
            <input type="date" id="searchCheckin" />
            <input type="date" id="searchCheckout" />
            <button class="btn btn-primary">
              <i class="fas fa-search"></i> Tìm
            </button>
          </div>
          <div class="view-toggle">
            <button class="view-btn active" data-view="list">
              <i class="fas fa-list"></i> Danh sách
            </button>
            <button class="view-btn" data-view="map">
              <i class="fas fa-map"></i> Bản đồ
            </button>
          </div>
        </div>

        <!-- Sort Options -->
        <div class="sort-options">
          <span>Sắp xếp theo:</span>
          <select id="sortBy">
            <option value="recommended">Đề xuất</option>
            <option value="price_asc">Giá thấp đến cao</option>
            <option value="price_desc">Giá cao đến thấp</option>
            <option value="rating">Đánh giá cao nhất</option>
            <option value="distance">Khoảng cách gần nhất</option>
          </select>
          <span id="resultCount" class="result-count"
            >Tìm thấy 0 khách sạn</span
          >
        </div>

        <!-- Results Container -->
        <div id="searchResults" class="search-results">
          <!-- Hotel cards will be loaded here -->
          <div class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Đang tìm kiếm khách sạn...</p>
          </div>
        </div>

        <!-- Map Container -->
        <div id="mapContainer" class="map-container" style="display: none">
          <div id="map"></div>
        </div>
      </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/map.js"></script>
    <script src="/static/js/search.js"></script>
  </body>
</html>
