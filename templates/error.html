{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lỗi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .error-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .error-box {
            background: white;
            border: 2px solid #e74c3c;
            border-radius: 10px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.2);
        }

        .error-box h1 {
            color: #e74c3c;
            margin: 0 0 20px 0;
            font-size: 2em;
        }

        .error-message {
            color: #2c3e50;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        .error-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-back {
            padding: 10px 20px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
            display: inline-block;
        }

        .btn-back:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-box">
            <h1>⚠️ Lỗi</h1>
            <p class="error-message">{{ error_message }}</p>
            
            <div class="error-actions">
                <a href="/" class="btn-back">← Trang Chủ</a>
                <a href="javascript:history.back()" class="btn-back">← Quay Lại</a>
            </div>
        </div>
    </div>
</body>
</html>
