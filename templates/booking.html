{% load static %}
<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Xác nhận đặt phòng - Hotel GIS</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}" />
  <script src="{% static 'js/booking.js' %}" defer></script>
</head>

<body>

<!-- ===== DATA BẮT BUỘC CHO JS ===== -->
<input type="hidden" id="hotelId" value="{{ hotel.hotel_id }}">
<input type="hidden" id="roomId" value="{{ room.room_id }}">
<input type="hidden" id="roomPrice" value="{{ room.room_type.base_price }}">

<header class="header">
  <nav>
    <a href="/">Trang chủ</a>
    <a href="/my-bookings/">Đơn đặt phòng</a>
  </nav>
</header>

<div style="max-width:1200px;margin:12px auto;padding:0 16px;">
  {% if request.user.is_authenticated %}
    <div style="text-align:right">Xin chào, <strong>{{ request.user.first_name|default:request.user.username }}</strong> — <a href="/logout/">Đăng xuất</a></div>
  {% else %}
    <div style="text-align:right"><a href="/login/">Đăng nhập</a> | <a href="/register/">Đăng ký</a></div>
  {% endif %}
</div>

<main class="booking-page">
  <div class="container">

    <h2>Xác nhận đặt phòng</h2>

    <!-- ===== FORM BOOKING ===== -->
    <form id="bookingForm" onsubmit="return false;">
      {% csrf_token %}

      <div class="form-group">
        <label for="checkin">Nhận phòng</label>
        <input type="date" id="checkin" required>
      </div>

      <div class="form-group">
        <label for="checkout">Trả phòng</label>
        <input type="date" id="checkout" required>
      </div>

      <div class="form-group">
        <label for="guests">Số khách</label>
        <select id="guests" required>
          <option value="1">1 người</option>
          <option value="2">2 người</option>
          <option value="3">3 người</option>
        </select>
      </div>

      <div class="form-group">
        <label for="paymentMethod">Phương thức thanh toán</label>
        <select id="paymentMethod" required>
          <option value="">-- Chọn phương thức --</option>
          <option value="cash">Tiền mặt</option>
          <option value="bank">Chuyển khoản</option>
          <option value="momo">MoMo</option>
        </select>
      </div>

      <button type="button" id="confirmBookingBtn" class="btn btn-primary">
        Xác nhận đặt phòng
      </button>

    </form>

  </div>
</main>

</body>
</html>
