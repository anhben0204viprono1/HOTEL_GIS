{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Đăng ký — Hotel GIS</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <style>
        body{background:linear-gradient(135deg,#fff5f7,#e6f4ff);font-family:Segoe UI,Roboto,Arial,sans-serif}
        .auth-container{max-width:520px;margin:5vh auto;padding:26px;background:#fff;border-radius:10px;box-shadow:0 8px 32px rgba(19,38,56,.06)}
        .auth-header h1{font-size:20px;margin:0;color:#1f3a49}
        label{display:block;font-size:13px;color:#334;margin-bottom:6px}
        input{width:100%;padding:12px 14px;border:1px solid #e6eef5;border-radius:8px;margin-bottom:12px}
        .btn{background:#16a34a;color:#fff;padding:10px 16px;border-radius:8px;border:none;cursor:pointer}
        .small{font-size:13px;color:#6b7a86}
        .messages{margin-bottom:12px}
        .msg{padding:10px;border-radius:6px;margin-bottom:6px}
        .msg.error{background:#fdecea;color:#611a15}
        .msg.success{background:#ecfdf3;color:#0b6346}
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Đăng ký tài khoản mới</h1>
        </div>

        <p class="small">Tạo tài khoản để đặt phòng nhanh hơn và quản lý các đặt phòng của bạn.</p>

        <div class="messages">
            {% if messages %}
                {% for m in messages %}
                    <div class="msg {{ m.tags }}">{{ m }}</div>
                {% endfor %}
            {% endif %}
        </div>

        <form method="post" action="">
            {% csrf_token %}
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">

            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" required placeholder="Mật khẩu (tối thiểu 8 ký tự)">

            <label for="password2">Nhập lại mật khẩu</label>
            <input type="password" id="password2" name="password2" required placeholder="Nhập lại mật khẩu">

            <div style="display:flex;align-items:center;gap:12px;margin-top:6px">
                <button class="btn" type="submit">Tạo tài khoản</button>
                <a class="small link" href="/login/">Đã có tài khoản? Đăng nhập</a>
            </div>
        </form>

        <script>
            // simple client-side check for matching passwords
            const form = document.querySelector('form');
            form.addEventListener('submit', function(e){
                const p1 = document.getElementById('password').value;
                const p2 = document.getElementById('password2').value;
                if(p1 !== p2){
                    e.preventDefault();
                    alert('Mật khẩu không khớp. Vui lòng kiểm tra lại.');
                }
            });
        </script>
    </div>
</body>
</html>
