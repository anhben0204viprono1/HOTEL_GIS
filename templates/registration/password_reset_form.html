{% extends 'base.html' %}
{% block title %}Quên mật khẩu — Hotel GIS{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:460px;">
  <div class="bg-white rounded-3 shadow-sm p-5">
    <div class="text-center mb-4">
      <div style="font-size:2.5rem;">🔑</div>
      <h2 style="font-family:'Cormorant Garamond',serif;" class="mb-1">Quên mật khẩu</h2>
      <p class="text-muted" style="font-size:13px;">Nhập email để nhận link đặt lại mật khẩu</p>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#C9A84C;">Email</label>
        <input type="email" name="email" class="form-control" required placeholder="your@email.com">
        {% if form.email.errors %}
          <div class="text-danger" style="font-size:12px;">{{ form.email.errors.0 }}</div>
        {% endif %}
      </div>
      <button type="submit" class="btn btn-gold w-100 py-2">Gửi link đặt lại mật khẩu</button>
    </form>
    <p class="text-center mt-3" style="font-size:13px;">
      <a href="{% url 'accounts:login' %}" style="color:#C9A84C;">← Quay lại đăng nhập</a>
    </p>
  </div>
</div>
{% endblock %}
